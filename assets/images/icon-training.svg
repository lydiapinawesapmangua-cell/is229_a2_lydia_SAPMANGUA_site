<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff0fa"/>
      <stop offset="1" stop-color="#a9d8ef"/>
    </linearGradient>
  </defs>
  <rect width="460" height="260" fill="url(#bgGrad)"/>

  <!-- desk -->
  <rect x="0" y="215" width="460" height="45" fill="#c7dfec"/>

  <!-- background monitors row -->
  <g fill="#eaf5fb" stroke="#8fbdd6" stroke-width="2" opacity="0.85">
    <rect x="30" y="90" width="70" height="85" rx="3"/>
    <rect x="110" y="70" width="90" height="105" rx="3"/>
    <rect x="360" y="80" width="80" height="95" rx="3"/>
  </g>

  <!-- diagonal light streak -->
  <polygon points="40,60 130,60 280,210 190,210" fill="#ffffff" opacity="0.35"/>

  <!-- keyboard -->
  <rect x="150" y="195" width="160" height="26" rx="4" fill="#e4f0f8" stroke="#8fbdd6" stroke-width="2"/>
  <g stroke="#8fbdd6" stroke-width="1">
    <line x1="160" y1="203" x2="300" y2="203"/>
    <line x1="160" y1="211" x2="300" y2="211"/>
  </g>

  <!-- text -->
  <text x="230" y="130" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#111111" text-anchor="middle">IT</text>
  <text x="230" y="180" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#111111" text-anchor="middle">TRAINING</text>
</svg>
