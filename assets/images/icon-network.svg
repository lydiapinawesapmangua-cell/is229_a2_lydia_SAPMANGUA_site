<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 350" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="460" height="350" fill="#ffffff"/>

  <!-- connecting lines -->
  <g stroke="#3fa9dc" stroke-width="4">
    <line x1="230" y1="140" x2="95" y2="185"/>
    <line x1="230" y1="140" x2="170" y2="120"/>
    <line x1="230" y1="140" x2="290" y2="115"/>
    <line x1="230" y1="140" x2="370" y2="140"/>
    <line x1="230" y1="140" x2="60" y2="235"/>
    <line x1="230" y1="140" x2="330" y2="260"/>
  </g>

  <!-- globe -->
  <circle cx="230" cy="140" r="38" fill="#e8f3fa" stroke="#3fa9dc" stroke-width="3"/>
  <ellipse cx="230" cy="140" rx="38" ry="16" fill="none" stroke="#3fa9dc" stroke-width="2"/>
  <ellipse cx="230" cy="140" rx="16" ry="38" fill="none" stroke="#3fa9dc" stroke-width="2"/>
  <path d="M198 128q14 10 32 4t28 10" fill="none" stroke="#2f7ea6" stroke-width="4" stroke-linecap="round"/>
  <path d="M205 158q12 -8 25 -2t22 6" fill="none" stroke="#2f7ea6" stroke-width="4" stroke-linecap="round"/>

  <!-- node platform helper -->
  <g id="platform">
    <ellipse cx="0" cy="14" rx="42" ry="12" fill="#3fa9dc"/>
  </g>

  <!-- laptop node left -->
  <g transform="translate(95,185)">
    <use href="#platform"/>
    <rect x="-22" y="-18" width="44" height="26" rx="2" fill="#1d3c5c"/>
    <rect x="-18" y="-14" width="36" height="18" fill="#8fd3ef"/>
    <polygon points="-26,8 26,8 34,18 -34,18" fill="#c7ccd1"/>
  </g>

  <!-- server node top -->
  <g transform="translate(170,120)">
    <use href="#platform"/>
    <rect x="-12" y="-38" width="24" height="40" rx="2" fill="#22262b"/>
    <line x1="-8" y1="-30" x2="8" y2="-30" stroke="#4a4f57" stroke-width="2"/>
    <line x1="-8" y1="-22" x2="8" y2="-22" stroke="#4a4f57" stroke-width="2"/>
    <line x1="-8" y1="-14" x2="8" y2="-14" stroke="#4a4f57" stroke-width="2"/>
    <circle cx="6" cy="-6" r="1.6" fill="#3fa9dc"/>
  </g>

  <!-- laptop node top-right -->
  <g transform="translate(290,115)">
    <use href="#platform"/>
    <rect x="-20" y="-16" width="40" height="22" rx="2" fill="#1d3c5c"/>
    <rect x="-16" y="-13" width="32" height="15" fill="#8fd3ef"/>
    <polygon points="-24,6 24,6 30,14 -30,14" fill="#c7ccd1"/>
  </g>

  <!-- server node right -->
  <g transform="translate(370,140)">
    <use href="#platform"/>
    <rect x="-12" y="-38" width="24" height="40" rx="2" fill="#22262b"/>
    <line x1="-8" y1="-30" x2="8" y2="-30" stroke="#4a4f57" stroke-width="2"/>
    <line x1="-8" y1="-22" x2="8" y2="-22" stroke="#4a4f57" stroke-width="2"/>
    <line x1="-8" y1="-14" x2="8" y2="-14" stroke="#4a4f57" stroke-width="2"/>
    <circle cx="6" cy="-6" r="1.6" fill="#3fa9dc"/>
  </g>

  <!-- laptop node bottom-left -->
  <g transform="translate(60,235)">
    <use href="#platform"/>
    <rect x="-22" y="-18" width="44" height="26" rx="2" fill="#1d3c5c"/>
    <rect x="-18" y="-14" width="36" height="18" fill="#8fd3ef"/>
    <polygon points="-26,8 26,8 34,18 -34,18" fill="#c7ccd1"/>
  </g>

  <!-- laptop node bottom-right, larger/foreground -->
  <g transform="translate(330,265) scale(1.3)">
    <use href="#platform"/>
    <rect x="-24" y="-20" width="48" height="28" rx="2" fill="#1d3c5c"/>
    <rect x="-20" y="-16" width="40" height="20" fill="#8fd3ef"/>
    <polygon points="-28,8 28,8 36,18 -36,18" fill="#c7ccd1"/>
  </g>
</svg>
