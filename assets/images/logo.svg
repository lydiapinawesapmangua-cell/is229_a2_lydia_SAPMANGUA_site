<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="500" height="300" fill="#ffffff"/>

  <!-- angular background shard -->
  <polygon points="120,150 190,60 190,240" fill="#d9dde1"/>
  <polygon points="100,150 165,75 200,150 165,225" fill="#4a9bc9"/>
  <polygon points="100,150 165,75 130,150" fill="#0e2033"/>
  <polygon points="100,150 165,225 130,150" fill="#0e2033"/>

  <!-- circuit lines top-left -->
  <g stroke="#9aa7b0" stroke-width="1.5" fill="none">
    <path d="M60 110h30l10-10h20"/>
    <path d="M55 130h35"/>
    <circle cx="60" cy="110" r="2.5" fill="#9aa7b0"/>
    <circle cx="55" cy="130" r="2.5" fill="#9aa7b0"/>
  </g>
  <!-- circuit lines top-right -->
  <g stroke="#9aa7b0" stroke-width="1.5" fill="none">
    <path d="M240 95h30l10-10h30"/>
    <circle cx="310" cy="85" r="2.5" fill="#9aa7b0"/>
  </g>
  <!-- small gears top -->
  <circle cx="165" cy="48" r="7" fill="none" stroke="#0e2033" stroke-width="2"/>
  <circle cx="180" cy="62" r="9" fill="none" stroke="#0e2033" stroke-width="2"/>

  <!-- main gear -->
  <circle cx="150" cy="150" r="34" fill="#ffffff" stroke="#0e2033" stroke-width="3"/>
  <circle cx="150" cy="150" r="18" fill="none" stroke="#0e2033" stroke-width="6"/>
  <circle cx="150" cy="150" r="5" fill="#0e2033"/>
  <g stroke="#0e2033" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="126" x2="150" y2="120"/>
    <line x1="150" y1="180" x2="150" y2="174"/>
    <line x1="126" y1="150" x2="120" y2="150"/>
    <line x1="180" y1="150" x2="174" y2="150"/>
  </g>

  <!-- wordmark -->
  <text x="230" y="168" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#12263f">pinawe</text>
  <text x="230" y="208" font-family="Arial, sans-serif" font-size="38" font-weight="600" fill="#12263f">software.co</text>

  <!-- bottom repeated wordmark -->
  <text x="250" y="270" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#12263f" text-anchor="middle">pinawe software.co</text>
</svg>
